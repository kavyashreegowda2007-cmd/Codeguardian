services:
  # Single full-stack service: FastAPI backend + React frontend in one container.
  # The backend serves the built frontend as static files on every non-/api route.
  - type: web
    name: codeguardian
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # CORS: allow the Render public URL and local dev
      - key: ALLOWED_ORIGINS
        value: https://codeguardian-v1ef.onrender.com,http://localhost:5173,http://127.0.0.1:5173

      # SQLite storage path inside the container.
      - key: CODEGUARDIAN_DB_PATH
        value: /tmp/.codeguardian/analyses.sqlite3

      # LLM provider for patch generation: openrouter
      - key: LLM_PROVIDER
        value: openrouter

      # OpenRouter settings
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      # OPENROUTER_API_KEY must be set in Render dashboard → Environment
      # - key: OPENROUTER_API_KEY
      #   sync: false

      # Nebius Token Factory settings
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      # NEBIUS_API_KEY must be set in Render dashboard → Environment
      # - key: NEBIUS_API_KEY
      #   sync: false
